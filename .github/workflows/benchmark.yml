name: Windows synthetic comparison
on:
  push:
    branches: ['validation/benchmark', 'improve/native-lightweight', 'improve/resident-latency']
    paths:
      - '.github/workflows/benchmark.yml'
      - 'runtime/**'
      - 'warden.py'
      - 'examples/**'
      - 'package*.json'
      - 'scripts/benchmark*'
      - 'scripts/soak_metrics.py'
      - 'tests/test_benchmark_metrics.py'
      - 'tests/benchmark-*.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Prepare immutable Warden v0.2 baseline without dependencies
        shell: pwsh
        run: |
          $commit = '5c95856307e6610c9a1cf2b19a2f6d5cd208deea'
          git -c http.extraheader= fetch --no-tags --depth=1 https://github.com/Borregro4/mcp-warden.git $commit
          if ($LASTEXITCODE -ne 0) { throw 'Immutable baseline fetch failed' }
          $resolved = (git rev-parse FETCH_HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $resolved -ne $commit) { throw 'Immutable baseline commit mismatch' }
          $baseline = Join-Path $env:RUNNER_TEMP 'warden-v02-baseline'
          New-Item -ItemType Directory -Path $baseline | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'warden-v02-baseline.tar'
          git -c core.autocrlf=false archive --format=tar --output=$archive $commit
          if ($LASTEXITCODE -ne 0) { throw 'Immutable baseline archive failed' }
          tar -xf $archive -C $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Immutable baseline extraction failed' }
      - name: Download and verify upstream release
        shell: pwsh
        run: |
          $thirdParty = Join-Path $env:RUNNER_TEMP 'snooze-official'
          New-Item -ItemType Directory -Force -Path $thirdParty | Out-Null
          $archive = Join-Path $thirdParty 'mcp-snooze-windows.zip'
          Invoke-WebRequest -Uri 'https://github.com/askmegit/mcp-snooze/releases/download/v0.1.0/mcp-snooze_0.1.0_windows_amd64.zip' -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '1694342e4d7f4cf64cfdd17e65edc10280a7727be438bd9328ff8824b0442880') { throw 'Upstream archive digest mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $thirdParty
      - name: Run predeclared version-4 six-way comparison
        shell: pwsh
        run: |
          $binary = Join-Path $env:RUNNER_TEMP 'snooze-official/mcp-snooze.exe'
          $results = Join-Path $env:RUNNER_TEMP 'benchmark-raw'
          $baseline = Join-Path $env:RUNNER_TEMP 'warden-v02-baseline'
          node scripts/benchmark.mjs --snooze $binary --baseline $baseline --out $results --runs 3
      - name: Select synthetic report files only
        if: always()
        shell: pwsh
        run: |
          $raw = Join-Path $env:RUNNER_TEMP 'benchmark-raw'
          $public = Join-Path $env:RUNNER_TEMP 'benchmark-public'
          New-Item -ItemType Directory -Force -Path $public | Out-Null
          $tokens = @()
          if (Test-Path -LiteralPath $raw) {
            $tokens = @(Get-ChildItem -LiteralPath $raw -Filter token -Recurse -File | ForEach-Object { (Get-Content -Raw -LiteralPath $_.FullName).Trim() })
          }
          foreach ($name in @('plan.json','results.json','summary.json','environment-abort.json')) {
            $source = Join-Path $raw $name
            if (Test-Path -LiteralPath $source) {
              $text = Get-Content -Raw -LiteralPath $source
              $null = $text | ConvertFrom-Json
              foreach ($token in $tokens) {
                if ($token.Length -ge 32 -and $text.Contains($token)) { throw 'Runtime token detected in report; refusing upload' }
              }
              Copy-Item -LiteralPath $source -Destination (Join-Path $public $name)
            }
          }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-synthetic-comparison
          path: ${{ runner.temp }}/benchmark-public/*.json
          if-no-files-found: warn
          retention-days: 7
